name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy --python-version 3.11 aegisops
      - run: pytest
      - run: python scripts/fault_report.py --check

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        # Multi-arch build of the official docker-postgis images (same as docker-compose.yml).
        image: imresamu/postgis:16-3.5
        env:
          POSTGRES_USER: aegisops
          POSTGRES_PASSWORD: aegisops
          POSTGRES_DB: aegisops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegisops" --health-interval 5s --health-timeout 3s
          --health-retries 24
    env:
      AEGISOPS_TEST_POSTGRES_URL: postgresql+psycopg://aegisops:aegisops@localhost:5432/aegisops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/test_postgres.py -rs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aegisops-ci .
      - run: docker run -d --name aegisops -p 8000:8000 -e AEGISOPS_ENVIRONMENT=development aegisops-ci
      - name: Probe readiness and a seeded decision
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8000/health/ready && break
            sleep 2
          done
          ready=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/ready)
          token=$(curl -s -X POST http://localhost:8000/api/v1/dev/token \
            -H 'Content-Type: application/json' -d '{"sub": "ci", "role": "operator"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          decision=$(curl -s -o decision.json -w '%{http_code}' \
            -X POST http://localhost:8000/api/v1/decisions \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $token" \
            -d '{"seed": 42}')
          echo "health/ready=$ready decisions=$decision"
          cat decision.json
          if [ "$ready" != "200" ] || [ "$decision" != "200" ]; then
            exit 1
          fi
      - name: Container logs
        if: failure()
        run: docker logs aegisops

  eval-smoke:
    # 20 Reader cases replayed from recorded LLM cassettes: no key, no network, deterministic.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Smoke eval from cassettes
        run: |
          if [ ! -f evals/smoke_expected.json ]; then
            echo "::warning::No cassettes recorded yet; run 'python -m evals.run --record-smoke' with a key."
            exit 0
          fi
          python -m evals.run --smoke
