# `docker compose up` -> API on http://localhost:8000, console on http://localhost:5173.
# The API applies migrations and records one demo decision (synthetic seed 42) on first start.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AEGISOPS_ENVIRONMENT=development
      - AEGISOPS_DEBUG=true
      - AEGISOPS_CORS_ORIGINS=http://localhost:5173
      - AEGISOPS_SECRET_KEY=${AEGISOPS_SECRET_KEY:-dev-secret-key-change-in-production}
      - AEGISOPS_RATE_LIMIT=100/minute
    volumes:
      - aegisops-data:/app/data
    command:
      - sh
      - -c
      - >-
        alembic -c backend/alembic.ini upgrade head &&
        python -m backend.seed &&
        exec uvicorn backend.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 24

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_DEV_AUTH: "true"
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  aegisops-data:
